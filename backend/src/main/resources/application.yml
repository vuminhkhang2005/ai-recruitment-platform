server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: talentbridge-backend

  datasource:
    url: jdbc:mysql://localhost:3306/ai_recruitment_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: TalentBridgeHikariCP

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# SpringDoc OpenAPI / Swagger 3.0 Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.talentbridge.backend: DEBUG
    org.hibernate.SQL: INFO
    org.springframework.web: INFO

# Application Security & JWT Properties
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 1800000 # 30 mins
    refresh-token-expiration-ms: 604800000 # 7 days
    cookie-name-access: accessToken
    cookie-name-refresh: refreshToken
    cookie-secure: false # Set true in HTTPS production
    same-site: Lax
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:talentbridge-google-client-id}
    linkedin:
      client-id: ${LINKEDIN_CLIENT_ID:talentbridge-linkedin-client-id}
