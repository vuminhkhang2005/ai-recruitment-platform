server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: talentbridge-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:mysql://localhost:3306/ai_recruitment_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: TalentBridgeHikariCP

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Existing databases (created from docs/phase-2-design DDL) are stamped as V1,
  # then db/migration/V2+ scripts are applied incrementally.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial schema from 02_DATABASE_SCHEMA_DDL.sql"
    locations: classpath:db/migration

  # SMTP. Local default = MailDev (npx maildev -> SMTP :1025, inbox UI :1080).
  # Production: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=... MAIL_PASSWORD=<app password> MAIL_STARTTLS=true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  thymeleaf:
    check-template-location: false

# SpringDoc OpenAPI / Swagger 3.0 Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.talentbridge.backend: DEBUG
    org.hibernate.SQL: INFO
    org.springframework.web: INFO

# Application Security & JWT Properties
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 1800000 # 30 mins
    refresh-token-expiration-ms: 604800000 # 7 days
    cookie-name-access: accessToken
    cookie-name-refresh: refreshToken
    cookie-secure: false # Set true in HTTPS production
    same-site: Lax
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:talentbridge-google-client-id}
    linkedin:
      client-id: ${LINKEDIN_CLIENT_ID:talentbridge-linkedin-client-id}
  storage:
    dir: ${APP_STORAGE_DIR:uploads}
  # Base URL of the React app, used to build links inside e-mails (invitations, application pages)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:TalentBridge <no-reply@talentbridge.vn>}
  invitations:
    ttl-days: 7
  demo:
    # Seed data ships with placeholder (non-verifiable) BCrypt hashes. When enabled, those
    # accounts get a real hash of default-password at startup so demo logins work.
    reset-placeholder-passwords: ${APP_DEMO_RESET_PASSWORDS:true}
    default-password: ${APP_DEMO_PASSWORD:Password@123}
