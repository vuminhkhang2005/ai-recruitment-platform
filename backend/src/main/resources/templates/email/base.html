<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">TalentBridge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }
        .header {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            padding: 30px;
            text-align: center;
            color: #ffffff;
        }
        .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }
        .brand span {
            color: #a7f3d0;
        }
        .content {
            padding: 36px 32px;
        }
        .heading {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .greeting {
            font-size: 16px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 16px;
        }
        p {
            margin-top: 0;
            margin-bottom: 16px;
            color: #475569;
            font-size: 15px;
        }
        .card {
            background-color: #f1f5f9;
            border-left: 4px solid #059669;
            border-radius: 6px;
            padding: 16px 20px;
            margin: 24px 0;
        }
        .detail-row {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            font-weight: 600;
            color: #334155;
            display: inline-block;
            min-width: 120px;
        }
        .detail-value {
            color: #0f172a;
        }
        .btn-wrapper {
            text-align: center;
            margin: 32px 0 24px;
        }
        .btn {
            display: inline-block;
            background-color: #059669;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 28px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2);
        }
        .footer {
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 24px 32px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }
        .footer a {
            color: #059669;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="brand">Talent<span>Bridge</span></h1>
        </div>
        <div class="content">
            <h2 class="heading" th:if="${heading}" th:text="${heading}">Thông báo</h2>
            <div class="greeting" th:if="${recipientName}">Xin chào <span th:text="${recipientName}">Ứng viên</span>,</div>
            
            <div th:each="paragraph : ${paragraphs}">
                <p th:text="${paragraph}">Nội dung email...</p>
            </div>

            <div class="card" th:if="${details != null and !details.isEmpty()}">
                <div class="detail-row" th:each="item : ${details}">
                    <span class="detail-label" th:text="${item.key}">Thông tin</span>:
                    <span class="detail-value" th:text="${item.value}">Giá trị</span>
                </div>
            </div>

            <div class="btn-wrapper" th:if="${ctaUrl != null and ctaText != null}">
                <a th:href="${ctaUrl}" class="btn" th:text="${ctaText}">Xem chi tiết</a>
            </div>

            <p style="margin-top: 24px; font-size: 14px; color: #64748b;" th:if="${signOff}" th:text="${signOff}">
                Trân trọng,<br>Đội ngũ TalentBridge
            </p>
        </div>
        <div class="footer">
            <p style="margin-bottom: 4px;">TalentBridge – Nền tảng kết nối ứng viên và nhà tuyển dụng công nghệ</p>
            <p style="margin-bottom: 0;">Email này được gửi tự động. Vui lòng không trả lời trực tiếp email này.</p>
        </div>
    </div>
</body>
</html>
