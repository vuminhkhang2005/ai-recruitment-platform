services:
  mysql:
    image: mysql:8.0
    container_name: talentbridge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ai_recruitment_db
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/phase-2-design/02_DATABASE_SCHEMA_DDL.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docs/phase-2-design/03_SEED_DATA.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-engine:
    build:
      context: ../talentbridge-ai-engine
      dockerfile: Dockerfile
    container_name: talentbridge-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentbridge-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-engine:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ai_recruitment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      AI_ENGINE_URL: http://ai-engine:8000
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_STORAGE_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      OAUTH2_SANDBOX_ENABLED: ${OAUTH2_SANDBOX_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      GOOGLE_SCRIPT_MAIL_URL: ${GOOGLE_SCRIPT_MAIL_URL:-}
      GOOGLE_SCRIPT_MAIL_SECRET: ${GOOGLE_SCRIPT_MAIL_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: talentbridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  backend_uploads:
